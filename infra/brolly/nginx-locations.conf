# INCLUDE INSIDE THE EXISTING brollysolutions.in HTTPS server {} BLOCK.
# This is not a replacement for the main site's nginx configuration.
location = /skillforge {
    return 308 /skillforge/$is_args$args;
}
location = /skillforge/api {
    return 308 /skillforge/api/$is_args$args;
}
location ^~ /skillforge/api/ {
    include /etc/nginx/snippets/skillforge-proxy.conf;
    proxy_pass http://127.0.0.1:8010/api/;
}
location = /skillforge/django-admin {
    return 308 /skillforge/django-admin/$is_args$args;
}
location ^~ /skillforge/django-admin/ {
    include /etc/nginx/snippets/skillforge-proxy.conf;
    proxy_pass http://127.0.0.1:8010/django-admin/;
}
location ^~ /skillforge/static/ {
    alias /srv/skillforge/staticfiles/;
    autoindex off;
    add_header X-Content-Type-Options nosniff;
}
# All material downloads go through the authenticated API.
location ^~ /skillforge/media/ { return 404; }
location = /skillforge/index.html {
    root /srv/skillforge/www;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
}
location ^~ /skillforge/assets/ {
    root /srv/skillforge/www;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
}
location ^~ /skillforge/monaco/ {
    root /srv/skillforge/www;
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff;
}
location ^~ /skillforge/ {
    root /srv/skillforge/www;
    index index.html;
    try_files $uri $uri/ /skillforge/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
}
