# Add INSIDE the EXISTING HTTPS server block for brollysolutions.in.
# Keep all current site routes. Do not create a competing server_name block.
location = /skillforge {
    return 308 /skillforge/;
}
location ^~ /skillforge/ {
    # No trailing slash here: the container gateway must receive /skillforge/.
    proxy_pass http://127.0.0.1:3830;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replace untrusted incoming forwarding headers at the public edge.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    client_max_body_size 12m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_redirect off;
}
