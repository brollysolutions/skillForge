worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Re-resolve the API address after Compose recreates its container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream skillforge_api {
        zone skillforge_api 64k;
        server api:8000 resolve;
    }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        absolute_redirect off;
        client_max_body_size 12m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        location = /healthz { access_log off; return 200 'ok\n'; }
        location = /skillforge { return 308 /skillforge/; }
        location = /skillforge/api { return 308 /skillforge/api/; }
        location = /skillforge/django-admin { return 308 /skillforge/django-admin/; }
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;

        location ^~ /skillforge/api/ {
            proxy_pass http://skillforge_api/api/;
        }
        location ^~ /skillforge/django-admin/ {
            proxy_pass http://skillforge_api/django-admin/;
        }
        location ^~ /skillforge/static/ { alias /staticfiles/; }
        location = /skillforge/media { return 404; }
        location ^~ /skillforge/media/ { return 404; }
        location ^~ /skillforge/assets/ { try_files $uri =404; }
        location ^~ /skillforge/monaco/ { try_files $uri =404; }
        location = /skillforge/index.html {
            add_header Cache-Control 'no-cache';
            try_files $uri =404;
        }
        location /skillforge/ { try_files $uri $uri/ /skillforge/index.html; }
        location / { return 404; }
    }
}
