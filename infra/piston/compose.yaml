# Run only on a dedicated Linux VM/host, with cgroup v2 enabled.
# Piston requires privileged mode. Do not run on the Django/database host.
services:
  piston:
    image: ${PISTON_IMAGE:-ghcr.io/engineer-man/piston:latest}
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec,size=268435456
    mem_limit: 768m
    pids_limit: 256
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_OUTPUT_MAX_SIZE: "16000"
      PISTON_MAX_PROCESS_COUNT: "16"
      PISTON_MAX_OPEN_FILES: "64"
      PISTON_MAX_FILE_SIZE: "65536"
      PISTON_MAX_CONCURRENT_JOBS: "2"
      PISTON_RUN_TIMEOUT: "5000"
      PISTON_COMPILE_TIMEOUT: "5000"
      PISTON_RUN_CPU_TIME: "2000"
      PISTON_COMPILE_CPU_TIME: "2000"
      PISTON_RUN_MEMORY_LIMIT: "128000000"
      PISTON_COMPILE_MEMORY_LIMIT: "128000000"
      PISTON_LOG_LEVEL: ERROR
volumes:
  piston-packages:
