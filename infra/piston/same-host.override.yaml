# Optional: copy to docker-compose.override.yml in the project root.
# Explicit same-server deployment: privileged Piston shares the host kernel.
# This is not VM isolation. A dedicated runner VM remains the stronger boundary.
services:
  api:
    environment:
      CODE_EXECUTION_PROVIDER: piston
      PISTON_URL: http://piston:2000/api/v2
      PISTON_PYTHON_VERSION: 3.x
      PISTON_API_TOKEN: ""
    networks:
      - default
      - code_runner

  piston:
    extends:
      file: infra/piston/compose.yaml
      service: piston
    networks:
      - code_runner
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  code_runner:

volumes:
  piston-packages:
